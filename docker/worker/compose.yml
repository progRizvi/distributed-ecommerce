# Runs background jobs (sends mail...). Same image as the app, different command.
services:
  worker:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    # Time to finish running jobs after "docker stop" (the worker waits up to 30s).
    stop_grace_period: 40s
    depends_on:
      redis: { condition: service_healthy }
