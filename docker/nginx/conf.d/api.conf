upstream app_upstream {
  server app:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://app_upstream;
  }

  location = /health {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://app_upstream;
  }
}
